<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Tabelas</title>
    <style>
        table {
            border-collapse: collapse;
        }

        thead {
            background-color:lightblue;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            width: 120px;
            text-align: center;
        }

        .media {
            background-color:blue;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th rowspan="2" scope="col">Areas</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2"  
            scope="col">Media</th>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tr>
            <th rowspan="4" scope="rowgroup">Exatas
            </th>
            <td>Matematica</td>
            <td>0,00</td>
            <td>0,00</td>
            <td>0,00</td>
        </tr>
        <tr>
            <td>Fisica</td>
            <td>0,00</td>
            <td>0,00</td>
            <td>0,00</td>
        </tr>
        <tr>
            <td>Quimica</td>
            <td>0,00</td>
            <td>0,00</td>
            <td>0,00</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>0,00</td>
            <td>0,00</td>
            <td>0,00</td>
        </tr>
        <tr class="media">
            <th colspan="4" scope="row">Media Exatas</th>
            <td>0,00</td>
        </tr>
        <tr>
            <th rowspan="2" scope="rowgroup">Humanas
            </th>
            <td>Historia</td>
            <td>0,00</td>
            <td>0,00</td>
            <td>0,00</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0,00</td>
            <td>0,00</td>
            <td>0,00</td>
        </tr>
           <tr class="media">
            <th colspan="4" scope="row">Media Humanas</th>
            <td>0,00</td>
        </tr>
    </table>
</body>
</html>
